name: Deploy to Digital Ocean

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via Native SSH
        env:
          SSH_KEY: ${{ secrets.DO_SSH_KEY }}
          HOST: ${{ secrets.DO_HOST }}
          USERNAME: ${{ secrets.DO_USERNAME }}
        run: |
          # Setup SSH Key
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          
          # Add Droplet to known_hosts to prevent strict checking prompt
          ssh-keyscan -H $HOST >> ~/.ssh/known_hosts
          
          # Execute deployment commands over SSH
          ssh $USERNAME@$HOST << 'EOF'
            set -e

            echo "==> Navigating to project directory..."
            cd /home/deploy/jobflow-ai

            echo "==> Pulling latest code..."
            git pull origin main

            echo "==> Installing dependencies..."
            npm install

            echo "==> Building Next.js (standalone mode)..."
            npm run build

            echo "==> Copying static + public to standalone..."
            mkdir -p .next/standalone/public
            mkdir -p .next/standalone/.next/static
            cp -a public/. .next/standalone/public/
            cp -a .next/static/. .next/standalone/.next/static/
            cp -a .next/server/. .next/standalone/.next/server/ || true
            
            echo "==> Copying Environment Variables..."
            cp .env.production .next/standalone/.env.production
            cp .env.production .next/standalone/.env

            echo "==> Restarting PM2 process..."
            pm2 restart ecosystem.config.cjs --update-env || pm2 start ecosystem.config.cjs

            echo "==> Deploy complete!"
          EOF
